name: Build Test Project

on:
  push:
  pull_request:

jobs:
  build_test_project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Create test project
        run: |
          mkdir -p test_project/src
          cp examples/SendSpeed/SendSpeed.ino test_project/src/main.cpp
          echo "[env:seeed_xiao_rp2040]" > test_project/platformio.ini
          echo "platform = https://github.com/maxgerhardt/platform-raspberrypi.git" >> test_project/platformio.ini
          echo "board = seeed_xiao_rp2040" >> test_project/platformio.ini
          echo "framework = arduino" >> test_project/platformio.ini
          echo "lib_deps = symlink://../" >> test_project/platformio.ini

      - name: Build test project
        run: |
          cd test_project
          pio run

  wokwi_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Wokwi simulation for FlipTurnout
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: examples/FlipTurnout
          timeout: 20000

      - name: Run Wokwi simulation for SendSpeed
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: examples/SendSpeed
          timeout: 20000

      - name: Upload VCD artifacts
        uses: actions/upload-artifact@v3
        with:
          name: vcd-artifacts
          path: |
            examples/FlipTurnout/output.vcd
            examples/SendSpeed/output.vcd
