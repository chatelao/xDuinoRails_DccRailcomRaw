board = seeed_xiao_rp2040
framework = arduino

[env:native]
platform = native
build_flags = -I ${PROJECT_DIR}/lib/DCCRailcom
build_src_filter = +<${PROJECT_DIR}/lib> +<${PROJECT_DIR}/test>
lib_deps =
  fabiobatsilva/ArduinoFake
  throwtheswitch/Unity
